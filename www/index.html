<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Nieskończone generowanie tekstu</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div id="kontener"></div>

    <script>
        const kontener = document.getElementById('kontener');
        
        function dodajTekst() {
            kontener.appendChild(document.createTextNode('Jebac PIS'));
            // setInterval wywoła funkcję ponownie po 0 milisekundach, tworząc nieskończoną pętlę
            setTimeout(dodajTekst, 0);
        }

        // Uruchomienie generowania tekstu po załadowaniu strony
        dodajTekst();
    </script>

</body>
</html>
